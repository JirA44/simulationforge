[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulationforge"
version = "1.0.7"
description = "Moteur de simulations, surfaces et dossiers d'incertitude déterministes et traçables"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["apps*"]
