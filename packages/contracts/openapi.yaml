openapi: 3.1.0
info:
  title: SimulationForge API
  description: Simulations, surfaces, incertitude, convergence, dérive et couverture
    explicite de scénarios déterministes, reproductibles et non prédictives.
  version: 1.0.7
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /info:
    get:
      summary: Info
      operationId: info_info_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/models:
    get:
      summary: List Models
      operationId: list_models_v1_models_get
