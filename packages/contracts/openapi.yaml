components:
  schemas:
    AuditEvent:
      properties:
        id:
          type: integer
          title: Id
        event_type:
          type: string
          title: Event Type
        entity_type:
          type: string
          title: Entity Type
        entity_id:
          type: string
          title: Entity Id
        payload:
          additionalProperties: true
          type: object
          title: Payload
        previous_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Previous Hash
        event_hash:
          type: string
          title: Event Hash
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - event_type
      - entity_type
      - entity_id
      - payload
      - previous_hash
      - event_hash
      - created_at
      title: AuditEvent
    ComparisonDeltas:
      properties:
        mean:
          type: number
          title: Mean
        p05:
          type: number
          title: P05
        p95:
          type: number
          title: P95
        baseline_downside:
          type: number
          title: Baseline Downside
        stress_downside:
          type: number
          title: Stress Downside
        downside:
          type: number
          title: Downside
      additionalProperties: false
      type: object
      required:
      - mean
      - p05
      - p95
      - baseline_downside
      - stress_downside
      - downside
      title: ComparisonDeltas
    ComparisonQualification:
      type: string
      enum:
      - ROBUST
      - FRAGILE
      - INSUFFICIENT
      title: ComparisonQualification
    ConvergenceDossier:
      properties:
        id:
          type: string
          title: Id
        run_ids:
          items:
            type: string
          type: array
          title: Run Ids
        scenario_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Id
        scenario_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Scenario Hash
        model_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Hash
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        algorithm_version:
          type: string
          title: Algorithm Version
        reference_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Run Id
        verified_run_count:
          type: integer
          title: Verified Run Count
        compatibility_errors:
          items:
            type: string
          type: array
          title: Compatibility Errors
        points:
          items:
            $ref: '#/components/schemas/ConvergencePoint'
          type: array
          title: Points
        worst_point:
          anyOf:
          - $ref: '#/components/schemas/WorstConvergencePoint'
          - type: 'null'
        thresholds:
          $ref: '#/components/schemas/ConvergenceThresholds'
        qualification:
          $ref: '#/components/schemas/ConvergenceQualification'
        warning:
          type: string
          title: Warning
        snapshot_hash:
          type: string
          title: Snapshot Hash
        reproducible:
          type: boolean
          title: Reproducible
        order_independent:
          type: boolean
          title: Order Independent
        idempotent_replay:
          type: boolean
          title: Idempotent Replay
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - run_ids
      - scenario_id
      - scenario_hash
      - model_hash
      - seed
      - algorithm_version
      - reference_run_id
      - verified_run_count
      - compatibility_errors
      - points
      - worst_point
      - thresholds
      - qualification
      - warning
      - snapshot_hash
      - reproducible
      - order_independent
      - idempotent_replay
      - created_at
      title: ConvergenceDossier
    ConvergenceDossierCreate:
      properties:
        run_ids:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 3
          title: Run Ids
      additionalProperties: false
      type: object
      required:
      - run_ids
      title: ConvergenceDossierCreate
    ConvergencePoint:
      properties:
        run_id:
          type: string
          title: Run Id
        iterations:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Iterations
        statistics:
          $ref: '#/components/schemas/SimulationStatistics'
        absolute_deviation:
          $ref: '#/components/schemas/SensitivityDeltas'
        relative_deviation:
          $ref: '#/components/schemas/CoreMetricDeviation'
      additionalProperties: false
      type: object
      required:
      - run_id
      - iterations
      - statistics
      - absolute_deviation
      - relative_deviation
      title: ConvergencePoint
    ConvergenceQualification:
      type: string
      enum:
      - CONVERGED
      - UNSTABLE
      - INSUFFICIENT
      - INCOMPATIBLE
      title: ConvergenceQualification
    ConvergenceThresholds:
      properties:
        minimum_distinct_budgets:
          type: integer
          title: Minimum Distinct Budgets
        minimum_reference_iterations:
          type: integer
          title: Minimum Reference Iterations
        relative_deviation_threshold:
          type: number
          title: Relative Deviation Threshold
      additionalProperties: false
      type: object
      required:
      - minimum_distinct_budgets
      - minimum_reference_iterations
      - relative_deviation_threshold
      title: ConvergenceThresholds
    CoreMetricDeviation:
      properties:
        mean:
          type: number
          minimum: 0.0
          title: Mean
        p05:
          type: number
          minimum: 0.0
          title: P05
        p95:
          type: number
          minimum: 0.0
          title: P95
        maximum:
          type: number
          minimum: 0.0
          title: Maximum
      additionalProperties: false
      type: object
      required:
      - mean
      - p05
      - p95
      - maximum
      title: CoreMetricDeviation
    Distribution:
      type: string
      enum:
      - constant
      - uniform
      - triangular
      title: Distribution
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InteractionMetrics:
      properties:
        grand_mean:
          type: number
          title: Grand Mean
        mean_range:
          type: number
          minimum: 0.0
          title: Mean Range
        relative_mean_range:
          type: number
          minimum: 0.0
          title: Relative Mean Range
        x_main_effect:
          $ref: '#/components/schemas/MainEffect'
        y_main_effect:
          $ref: '#/components/schemas/MainEffect'
        maximum_absolute_additive_residual:
          type: number
          minimum: 0.0
          title: Maximum Absolute Additive Residual
        relative_interaction_residual:
          type: number
          minimum: 0.0
          title: Relative Interaction Residual
        worst_cell:
          $ref: '#/components/schemas/WorstCell'
      additionalProperties: false
      type: object
      required:
      - grand_mean
      - mean_range
      - relative_mean_range
      - x_main_effect
      - y_main_effect
      - maximum_absolute_additive_residual
      - relative_interaction_residual
      - worst_cell
      title: InteractionMetrics
    InteractionQualification:
      type: string
      enum:
      - ADDITIVE
      - INTERACTIVE
      - SENSITIVE
      - INSUFFICIENT
      title: InteractionQualification
    InteractionSurface:
      properties:
        id:
          type: string
          title: Id
        scenario_id:
          type: string
          title: Scenario Id
        scenario_hash:
          type: string
          title: Scenario Hash
        model_hash:
          type: string
          title: Model Hash
        parameter_x:
          type: string
          title: Parameter X
        parameter_y:
          type: string
          title: Parameter Y
        parameter_x_unit:
          anyOf:
          - type: string
          - type: 'null'
